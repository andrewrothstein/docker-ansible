[project]
name = "docker_ansible"
version = "0.1.0"
description = "CI build and publish for docker-ansible using Dagger and uv."
readme = "README.md"
authors = [
    { name = "Andrew Rothstein", email = "andrew.rothstein@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    'dagger-io>=0.10.0',
    'uvicorn>=0.29.0',
    'typer>=0.12.3',
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

