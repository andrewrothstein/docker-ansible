---
version: '3'
dotenv:
  - .env
tasks:
  build:
    vars:
      os: '{{ .os | default "ubuntu" }}'
      os_ver: '{{ .os_ver | default "noble" }}'
      platforms: '{{ .platforms | default "linux/amd64,linux/arm64" }}'
    cmds:
      - >-
        dagger call
        build
        --os={{ .os | quote }}
        --os-ver={{ .os_ver | quote }}
        --platforms={{ .platforms | quote }}
  publish:
    vars:
      os: '{{ .os | default "ubuntu" }}'
      os_ver: '{{ .os_ver | default "noble" }}'
      dockerhub_username: '{{ .dockerhub_username | default "${DOCKERHUB_USERNAME}" }}'
      dockerhub_password: '{{ .dockerhub_password | default "env:DOCKERHUB_PASSWORD" }}'
      ghcr_username: '{{ .ghcr_username | default "${GITHUB_ACTOR}" }}'
      ghcr_password: '{{ .ghcr_password | default "env:GITHUB_TOKEN" }}'
      platforms: '{{ .platforms | default "linux/amd64,linux/arm64" }}'
    desc: Publish the Docker image to Docker Hub and GitHub Container Registry
    cmds:
      - >-
        dagger call
        publish
        --os={{ .os | quote }}
        --os-ver={{ .os_ver | quote }}
        --dockerhub-username={{ .dockerhub_username | quote }}
        --dockerhub-password={{ .dockerhub_password | quote }}
        --ghcr-username={{ .ghcr_username | quote }}
        --ghcr-password={{ .ghcr_password | quote }}
        --platforms={{ .platforms | quote }}
  test-role:
    vars:
      os: '{{ .os | default "alpine" }}'
      os_ver: '{{ .os_ver | default "3.20" }}'
      platforms: '{{ .platforms | default "linux/amd64" }}'
      role_name: '{{ .role_name | default "" }}'
      role_dir: '{{ .role_dir | default "" }}'
    desc: Test an Ansible role locally (requires role_dir)
    cmds:
      - cmd: |
          if [ -z "{{ .role_dir }}" ]; then
            echo "Error: role_dir is required. Example: task test-role role_dir=./my-ansible-role"
            exit 1
          fi
          args="--os={{ .os | quote }} --os-ver={{ .os_ver | quote }} --platforms={{ .platforms | quote }}"
          [ -n "{{ .role_name }}" ] && args="$args --role-name={{ .role_name | quote }}"
          args="$args --role-dir={{ .role_dir | quote }}"
          dagger call test-role $args
  test-role-publish:
    vars:
      os: '{{ .os | default "ubuntu" }}'
      os_ver: '{{ .os_ver | default "noble" }}'
      platforms: '{{ .platforms | default "linux/amd64" }}'
      role_name: '{{ .role_name | default "" }}'
      role_dir: '{{ .role_dir | default "" }}'
      target_registry: '{{ .target_registry | default "ghcr.io" }}'
      target_org: '{{ .target_org | default "${GITHUB_REPOSITORY_OWNER:-andrewrothstein}" }}'
      target_username: '{{ .target_username | default "${GITHUB_ACTOR}" }}'
      target_password: '{{ .target_password | default "env:GITHUB_TOKEN" }}'
    desc: Test an Ansible role and publish to registry
    cmds:
      - cmd: |
          args="--os={{ .os | quote }} --os-ver={{ .os_ver | quote }} --platforms={{ .platforms | quote }}"
          args="$args --target-registry={{ .target_registry | quote }}"
          args="$args --target-org={{ .target_org | quote }}"
          args="$args --target-username={{ .target_username | quote }}"
          args="$args --target-password={{ .target_password | quote }}"
          [ -n "{{ .role_name }}" ] && args="$args --role-name={{ .role_name | quote }}"
          [ -n "{{ .role_dir }}" ] && args="$args --role-dir={{ .role_dir | quote }}"
          dagger call test-role $args
  test:
    desc: Test core Dagger functions
    cmds:
      - dagger call ansible-cfg contents
      - dagger call localhost-inventory contents
      - dagger call requirements-yml contents
      - dagger call build-one --os=alpine --os-ver=3.20 --p=linux/amd64 with-exec --args='["ansible", "--version"]' stdout
