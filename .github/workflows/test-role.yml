---
name: test-role
on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:
jobs:
  test-role:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: alpine
            os_ver: "3.21"
          - os: alpine
            os_ver: "3.22"
          - os: ubuntu
            os_ver: noble
          - os: ubuntu
            os_ver: jammy
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone k9s ansible role
        uses: actions/checkout@v4
        with:
          repository: andrewrothstein/ansible-k9s
          path: ansible-k9s
      
      - name: Test the test-role function
        uses: dagger/dagger-for-github@v8
        with:
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: >-
            call
            test-role
            --os=${{ matrix.os }}
            --os-ver=${{ matrix.os_ver }}
            --platforms=linux/amd64
            --role-name=k9s
            --role-dir=./ansible-k9s
