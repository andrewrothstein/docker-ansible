---
name: test-role
on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:
jobs:
  test-role:
    runs-on: ubuntu-latest
    steps:
      # First checkout this repo to get access to the dagger module
      - uses: actions/checkout@v4

      # Then clone the k9s role to test
      - name: Clone k9s ansible role
        uses: actions/checkout@v4
        with:
          repository: andrewrothstein/ansible-k9s
          path: ansible-k9s

      # Test using a simple matrix for smoke testing
      - name: Test the test-role function on Alpine
        uses: dagger/dagger-for-github@v8
        with:
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: >-
            call
            test-role
            --os=alpine
            --os-ver=3.22
            --platforms=linux/amd64
            --role-name=k9s
            --role-dir=./ansible-k9s

      - name: Test the test-role function on Ubuntu
        uses: dagger/dagger-for-github@v8
        with:
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: >-
            call
            test-role
            --os=ubuntu
            --os-ver=noble
            --platforms=linux/amd64
            --role-name=k9s
            --role-dir=./ansible-k9s
