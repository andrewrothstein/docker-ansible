---
name: image-bake-and-scan
on:
  push:
  schedule:
    - cron:  '0 0 * * *'
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      distro: ${{ steps.read-matrix.outputs.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: read platform-matrix-v1.json
        id: read-matrix
        run: echo "distro=$(jq -cr '@json' < platform-matrix-v1.json)" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: [prepare-matrix]
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.prepare-matrix.outputs.distro) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Dagger
        uses: dagger/dagger-for-github@8.0.0
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        with:
          verb: call
          args: >-
            build
            --os "${{ matrix.distro.OS }}"
            --os-ver "${{ matrix.distro.OS_VER }}"
            ${{ matrix.distro.UPSTREAM_ORG && format('--upstream-org "{0}"', matrix.distro.UPSTREAM_ORG) || '' }}
            ${{ matrix.distro.UPSTREAM_OS && format('--upstream-os "{0}"', matrix.distro.UPSTREAM_OS) || '' }}
            ${{ matrix.distro.UPSTREAM_OS_VER && format('--upstream-os-ver "{0}"', matrix.distro.UPSTREAM_OS_VER) || '' }}
            --dockerhub-username "${{ vars.DOCKER_USERNAME }}"
            --dockerhub-password "${{ secrets.DOCKER_PASSWORD }}"
            --ghcr-username "${{ github.actor }}"
            --ghcr-password "${{ github.token }}"
