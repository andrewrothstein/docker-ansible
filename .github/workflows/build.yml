---
name: build
on:
  pull_request:
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      distro: ${{ steps.read-matrix.outputs.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: read platform-matrix-v1.json
        id: read-matrix
        run: echo "distro=$(jq -cr '@json' < platform-matrix-v1.json)" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: [prepare-matrix]
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.prepare-matrix.outputs.distro) }}
    permissions:
      contents: read
      security-events: write  # Required for uploading SARIF reports
    steps:
      - uses: actions/checkout@v4
      - name: build and publish to ttl.sh
        id: build
        run: |
          # Run dagger and capture output
          OUTPUT=$(dagger call \
            build-and-publish-temp \
            --os=${{ matrix.distro.OS }} \
            --os-ver=${{ matrix.distro.OS_VER }} \
            --upstream-org=${{ matrix.distro.UPSTREAM_ORG || 'library' }} \
            --upstream-os=${{ matrix.distro.UPSTREAM_OS || matrix.distro.OS }} \
            --upstream-os-ver=${{ matrix.distro.UPSTREAM_OS_VER || matrix.distro.OS_VER }} \
            --platforms=${{ matrix.distro.platforms }} \
            --ttl=1h)
          
          echo "Dagger output:"
          echo "$OUTPUT"
          
          # Save output for next step
          echo "$OUTPUT" > build-output.txt
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Extract image URLs
        id: images
        run: |
          # Read the output from previous step
          echo "=== Build output ==="
          cat build-output.txt
          echo "=== End output ==="
          
          # Try to parse as JSON array
          if jq -e . build-output.txt > /dev/null 2>&1; then
            echo "Output is valid JSON"
            IMAGE_URL=$(jq -r '.[0]' build-output.txt)
          else
            echo "Output is not JSON, extracting first line"
            # Get the first line which should be the first image URL
            IMAGE_URL=$(head -n1 build-output.txt | tr -d '[]"' | cut -d',' -f1)
          fi
          
          # If still no URL, try to find ttl.sh pattern
          if [ -z "$IMAGE_URL" ] || [ "$IMAGE_URL" = "null" ]; then
            echo "Trying to extract ttl.sh URL pattern"
            IMAGE_URL=$(grep -o 'ttl\.sh/[^ ]*' build-output.txt | head -n1 || echo "")
          fi
          
          if [ -z "$IMAGE_URL" ]; then
            echo "ERROR: Could not extract image URL from build output"
            exit 1
          fi
          
          echo "Extracted image URL: ${IMAGE_URL}"
          echo "image_url=${IMAGE_URL}" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.images.outputs.image_url }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        continue-on-error: true

      - name: Check SARIF file
        if: always()
        run: |
          echo "Checking for SARIF file..."
          ls -la trivy-results.sarif || echo "SARIF file not found"
          pwd
          ls -la

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'build-${{ matrix.distro.OS }}-${{ matrix.distro.OS_VER }}'

      - name: Generate scan summary
        if: always()
        run: |
          echo "## Build Vulnerability Scan for ${{ matrix.distro.OS }}:${{ matrix.distro.OS_VER }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scanned image:** \`${{ steps.images.outputs.image_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run a table format scan for the summary
          docker run --rm aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --no-progress \
            ${{ steps.images.outputs.image_url }} >> $GITHUB_STEP_SUMMARY || echo "No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
