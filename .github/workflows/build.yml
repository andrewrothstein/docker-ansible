---
name: build
on:
  pull_request:
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      distro: ${{ steps.read-matrix.outputs.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: read platform-matrix-v1.json
        id: read-matrix
        run: echo "distro=$(jq -cr '@json' < platform-matrix-v1.json)" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: [prepare-matrix]
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.prepare-matrix.outputs.distro) }}
    permissions:
      contents: read
      security-events: write  # Required for uploading SARIF reports
    steps:
      - uses: actions/checkout@v4
      - name: build and publish to ttl.sh
        id: build
        uses: dagger/dagger-for-github@8.0.0
        with:
          verb: call
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: >-
            build-and-publish-temp
            --os=${{ matrix.distro.OS }}
            --os-ver=${{ matrix.distro.OS_VER }}
            --upstream-org=${{ matrix.distro.UPSTREAM_ORG || 'library' }}
            --upstream-os=${{ matrix.distro.UPSTREAM_OS || matrix.distro.OS }}
            --upstream-os-ver=${{ matrix.distro.UPSTREAM_OS_VER || matrix.distro.OS_VER }}
            --platforms=${{ matrix.distro.platforms }}
            --ttl=1h

      - name: Extract image URLs
        id: images
        run: |
          # The output from build-and-publish-temp is a JSON array of image URLs
          echo "Image URLs published:"
          echo '${{ steps.build.outputs.stdout }}'

          # Parse the first image URL for scanning (they all have same content, different platforms)
          IMAGE_URL=$(echo '${{ steps.build.outputs.stdout }}' | jq -r '.[0]')
          echo "image_url=${IMAGE_URL}" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.images.outputs.image_url }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'build-${{ matrix.distro.OS }}-${{ matrix.distro.OS_VER }}'

      - name: Generate scan summary
        if: always()
        run: |
          echo "## Build Vulnerability Scan for ${{ matrix.distro.OS }}:${{ matrix.distro.OS_VER }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scanned image:** \`${{ steps.images.outputs.image_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run a table format scan for the summary
          docker run --rm aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --no-progress \
            ${{ steps.images.outputs.image_url }} >> $GITHUB_STEP_SUMMARY || echo "No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
